org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
# This machine runs an Android emulator alongside the build, so keep the build's footprint modest
# and avoid forking more workers than there is memory for.
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=false

kotlin.daemon.jvmargs=-Xmx1280m

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
